[project]
name = "aegis-ai"
version = "0.1.0"
description = "A local Jarvis-inspired command-line AI assistant prototype."
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Aegis AI Contributors"}]

[project.optional-dependencies]
voice = ["SpeechRecognition>=3.10", "PyAudio>=0.2", "pyttsx3>=2.90"]
vision = ["opencv-python>=4.9"]
desktop = ["SpeechRecognition>=3.10", "PyAudio>=0.2", "pyttsx3>=2.90", "opencv-python>=4.9"]

[project.scripts]
aegis = "aegis_ai.cli:main"
aegis-desktop = "aegis_ai.desktop:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
